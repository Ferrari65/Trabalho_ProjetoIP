<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de IP</title>
  <style>
    .app-form-group {
      margin-bottom: 15px;
    }
    .opcao-btn {
      margin: 5px;
      padding: 10px 20px;
      background-color: #6200ea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .opcao-btn:hover {
      background-color: #3700b3;
    }
    .opcao-btn.selected {
      background-color: #03a9f4;
    }
    .hidden {
      display: none;
    }
    .error-message {
      color: red;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <form class="app-form" id="formIP" action="/cadastroIP/addIP" method="POST" onsubmit="return validarFormulario(event)">
    <div class="app-form-group">
      <input class="app-form-control" name="utilizador" placeholder="Nome do Utilizador" required>
    </div>
    <div class="app-form-group">
      <input class="app-form-control" name="matricula" type="number" placeholder="Matrícula do Utilizador" required>
    </div>
    <div class="app-form-group">
      <h3>Selecione o tipo de endereço IP</h3>
      <div id="opcoes">
        <button type="button" class="opcao-btn" data-tipo="ipv4">IPv4</button>
        <button type="button" class="opcao-btn" data-tipo="ipv6">IPv6</button>
        <button type="button" class="opcao-btn" data-tipo="privada">Rede Privada</button>
        <button type="button" class="opcao-btn" data-tipo="publica">Rede Pública</button>
      </div>
    </div>
    <div class="app-form-group">
      <input id="ipInput" class="app-form-control hidden" name="ip" placeholder="Endereço IP" required>
      <div id="error-message" class="error-message hidden"></div>
    </div>
    <div class="app-form-group buttons">
      <button type="submit" class="app-form-button">Cadastrar</button>
    </div>
  </form>

  <script>
    let tipoSelecionado = null;

    // Seleciona os botões
    const botoes = document.querySelectorAll('.opcao-btn');

    // Adiciona evento de clique em cada botão
    botoes.forEach((botao) => {
      botao.addEventListener('click', () => {
        // Remove a seleção de todos os botões
        botoes.forEach(b => b.classList.remove('selected'));

        // Adiciona a classe 'selected' no botão clicado
        botao.classList.add('selected');

        // Define o tipo selecionado
        tipoSelecionado = botao.dataset.tipo;

        // Atualiza o placeholder do campo de IP
        const ipInput = document.getElementById('ipInput');
        ipInput.classList.remove('hidden');
        const errorMessage = document.getElementById('error-message');
        errorMessage.classList.add('hidden');

        if (tipoSelecionado === 'ipv4') {
          ipInput.placeholder = "Digite um endereço IPv4 (ex: 192.168.0.1)";
        } else if (tipoSelecionado === 'ipv6') {
          ipInput.placeholder = "Digite um endereço IPv6 (ex: 2001:0db8::ff00:42:8329)";
        } else if (tipoSelecionado === 'privada') {
          ipInput.placeholder = "Digite um IP para rede privada (ex: 192.168.0.0)";
        } else if (tipoSelecionado === 'publica') {
          ipInput.placeholder = "Digite um IP público (ex: 8.8.8.8)";
        }
      });
    });

    // Função para validar o formulário
    function validarFormulario(event) {
      const ipInput = document.getElementById('ipInput');
      const errorMessage = document.getElementById('error-message');
      const ip = ipInput.value;

      // Verifica se nenhum tipo foi selecionado
      if (!tipoSelecionado) {
        errorMessage.textContent = "Por favor, selecione o tipo de IP.";
        errorMessage.classList.remove('hidden');
        return false; // Impede o envio do formulário
      }

      // Validação para IPv4
      if (tipoSelecionado === 'ipv4') {
        const ipv4Regex = /^((25[0-5]|2[0-4][0-9]|[0-1]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[0-1]?[0-9][0-9]?)$/;
        if (!ipv4Regex.test(ip)) {
          errorMessage.textContent = "Endereço IPv4 inválido. Exemplo: 192.168.0.1";
          errorMessage.classList.remove('hidden');
          return false;
        }
      }

      // Validação para IPv6
      if (tipoSelecionado === 'ipv6') {
        const ipv6Regex = /^([0-9a-fA-F]{1,4}:){7,7}[0-9a-fA-F]{1,4}$/;
        if (!ipv6Regex.test(ip)) {
          errorMessage.textContent = "Endereço IPv6 inválido. Exemplo: 2001:0db8::ff00:42:8329";
          errorMessage.classList.remove('hidden');
          return false;
        }
      }

      // Validação para rede privada
      if (tipoSelecionado === 'privada') {
        const privadaRegex = /^10\..*|^192\.168\..*|^172\.(1[6-9]|2[0-9]|3[0-1])\..*/;
        if (!privadaRegex.test(ip)) {
          errorMessage.textContent = "Endereço de rede privada inválido. Exemplo: 192.168.0.1";
          errorMessage.classList.remove('hidden');
          return false;
        }
      }

      // Validação para rede pública
      if (tipoSelecionado === 'publica') {
        const publicaRegex = /^(?!10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[0-1]))((25[0-5]|2[0-4][0-9]|[0-1]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[0-1]?[0-9][0-9]?)$/;
        if (!publicaRegex.test(ip)) {
          errorMessage.textContent = "Endereço de rede pública inválido. Exemplo: 8.8.8.8";
          errorMessage.classList.remove('hidden');
          return false;
        }
      }

      return true; // Permite o envio do formulário se todos os dados forem válidos
    }
  </script>
</body>
</html>
